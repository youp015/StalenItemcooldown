name: StalenSMPCooldown
version: 1.0.0
main: nl.stalensmp.cooldown.StalenSMPCooldown
api-version: '1.20'
author: Youp / Winterslaap
description: Geavanceerde Item Cooldown plugin voor Stalen SMP
commands:
  stalencooldown:
    description: Herlaad de ItemCooldown config.json
    permission: stalencooldown.admin
    aliases: [screload, icreload]
permissions:
  stalencooldown.admin:
    description: Toegang tot het herladen van StalenSMPCooldown
    default: op
  stalencooldown.bypass:
    description: Omzeil alle item cooldowns
    default: op